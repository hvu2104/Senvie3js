<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giải mã làn da · Mô phỏng 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Gwendolyn:wght@700&family=Playfair+Display:ital,wght@1,400&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#4A3550;--hm:#9E3F5A;--xm:#3A5F9E;--cream:#FFF7F1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#EDE6F0;font:15px/1.5 'Be Vietnam Pro',sans-serif;color:var(--ink)}
canvas{display:block}
.top{position:fixed;left:20px;top:16px;pointer-events:none}
.top h1{font:700 52px/1 Gwendolyn;color:var(--hm);margin:0}
.top p{margin:2px 0 0;font-size:13px;opacity:.75}
.bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:calc(100% - 32px);background:rgba(255,255,255,.82);backdrop-filter:blur(8px);padding:8px;border-radius:99px}
.bar button{border:0;background:transparent;font:600 13px 'Be Vietnam Pro';color:var(--ink);padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
.bar button:hover{background:#F3E6EC}
.bar button.on{background:var(--ink);color:#fff}
.bar button.go{background:var(--hm);color:#fff}
.card{position:fixed;right:20px;top:16px;width:320px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-radius:20px;padding:18px 20px;transition:opacity .3s}
.card .k{font:600 11px 'Be Vietnam Pro';letter-spacing:.16em;text-transform:uppercase;color:var(--hm)}
.card h2{font:700 44px/1.05 Gwendolyn;color:var(--hm);margin:2px 0 4px}
.card .e{font:italic 400 16px 'Playfair Display';margin-bottom:8px}
.card ul{margin:0;padding-left:18px}.card li{margin-bottom:3px}
.card .v{margin-top:8px;padding-top:8px;border-top:1px solid #EED3E0;font-size:13px;opacity:.8}
.hint{position:fixed;left:20px;bottom:76px;font-size:12px;opacity:.6;pointer-events:none}
.dui{position:fixed;left:20px;top:110px;width:300px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:20px;padding:16px 20px;display:none}
.dui .k{font:600 11px 'Be Vietnam Pro';letter-spacing:.16em;text-transform:uppercase;color:var(--xm)}
.dui .age{font:700 54px/1 Gwendolyn;color:var(--xm);margin:4px 0 6px}
.dui input{width:100%;accent-color:#3A5F9E}
.dui .row{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:8px;font-size:13px;margin-top:6px}
.dui .tr{height:10px;border-radius:9px;background:#EEF3FA;overflow:hidden}.dui .tr i{display:block;height:100%;border-radius:9px;transition:width .5s}
.dui .n{font:italic 400 15px/1.4 'Playfair Display';margin-top:10px}
.dui .s{font-size:11px;opacity:.6;margin-top:6px}
@media (max-width:760px){.card{left:16px;right:16px;width:auto;top:auto;bottom:76px;padding:12px 16px;font-size:13px}.card h2{font-size:32px}.card ul{display:none}.top h1{font-size:38px}.top p{font-size:12px}.hint{display:none}.bar{left:16px;right:16px;transform:none;max-width:none}}
</style>

</head>

<div class="top"><h1>Giải mã làn da</h1><p>Mô phỏng giả định · phòng 40 × 24 m, cao 6 m · 1 cửa vào, 1 cửa ra</p></div>
<div class="card" id="card"></div>
<div class="bar" id="bar"></div>
<div class="hint">Kéo để xoay · cuộn để zoom · chuột phải để di chuyển · bấm vào bàn xoay để thử</div>
<div class="dui" id="dui"><div class="k">Bàn xoay hormone · thử xoay</div><div class="age" id="dage">9 tuổi</div><input type="range" id="drange" min="9" max="18" step="1" value="9" aria-label="Tuổi">
<div class="row">Dầu<div class="tr"><i id="b0" style="background:#E9C46A"></i></div></div><div class="row">Mụn<div class="tr"><i id="b1" style="background:#D48698"></i></div></div><div class="row">Nhạy cảm<div class="tr"><i id="b2" style="background:#7BA1E2"></i></div></div>
<div class="n" id="dnote"></div><div class="s">Số liệu minh hoạ, cần chuyên gia duyệt nội dung thật.</div></div>

const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .85, ...o });
function box(w, h, d, c, x, y, z, o) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), c.isMaterial ? c : mat(c, o));
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
function cyl(rt, rb, h, c, x, y, z, seg = 40) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat(c));
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function panel(w, h, draw, x, y, z, ry = 0, px = 512) {
  const tex = canvasTex(px, Math.round(px * h / w), draw);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, roughness: .9 }));
  m.position.set(x, y, z); m.rotation.y = ry; scene.add(m); return m;
}
const rr = (g, x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
const hex = (c) => '#' + c.toString(16).padStart(6, '0');
function label(text, x, y, z, { bg = '#fff', fg = '#4A3550', size = 1, font = '600 44px "Be Vietnam Pro"' } = {}) {
  const g0 = document.createElement('canvas').getContext('2d'); g0.font = font;
  const tw = Math.ceil(g0.measureText(text).width) + 56;
  const tex = canvasTex(tw, 80, (g, w, h) => { g.fillStyle = bg; rr(g, 0, 0, w, h, 40); g.fill(); g.font = font; g.fillStyle = fg; g.textBaseline = 'middle'; g.fillText(text, 28, h / 2 + 2); });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  s.scale.set(tw / 80 * 0.55 * size, 0.55 * size, 1); s.position.set(x, y, z); s.renderOrder = 10; scene.add(s); return s;
}
function bigLabel(text, x, y, z, color) {

// lotus sculpture: stage 0 bud, 1 half, 2 bloom
function lotus(stage, x, z, s = 1) {
  const g = new THREE.Group();
  const petalGeo = new THREE.SphereGeometry(1, 24, 16); petalGeo.translate(0, 1, 0);
  const ring = (n, open, sx, col, lift = 0, off = 0) => {
    for (let i = 0; i < n; i++) {
      const p = new THREE.Mesh(petalGeo, mat(col, { roughness: .6 })); p.scale.set(sx, 1, .16);
      const piv = new THREE.Group(); piv.rotation.y = (i / n) * Math.PI * 2 + off; p.rotation.x = -open; p.position.y = lift;
      p.castShadow = true; piv.add(p); g.add(piv);
    }
  };
  if (stage === 0) { ring(2, .08, .34, C.rose); ring(3, .45, .18, C.leaf, 0, .5); }
  if (stage === 1) { ring(3, .12, .3, C.rose); ring(4, .55, .36, C.blush, 0, .4); }
  if (stage === 2) { ring(5, .18, .3, C.rose); ring(6, .7, .36, C.blush, 0, .3); ring(7, 1.25, .38, C.pink, 0, .1); }
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.06, .08, 1.6, 10), mat(C.leaf)); stem.position.y = -.8; g.add(stem);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.2, .25, 40), mat(C.cream)); base.position.y = -1.6; base.receiveShadow = true; g.add(base);
  g.position.set(x, 1.72 * s, z); g.scale.setScalar(s); scene.add(g); return g;
}

}

// ---------- loop ----------
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const tmp = new THREE.Vector3(), tan = new THREE.Vector3(), side = new THREE.Vector3();
let last = performance.now(), curStage = null;

  const now = performance.now();
  const dt = Math.min((now - last) / 16.67, 3); last = now;
  for (const p of teens) {
    p.t = (p.t + p.sp * .02 * dt) % 1;
    flow.getPointAt(p.t, tmp); flow.getTangentAt(p.t, tan);
    side.set(-tan.z, 0, tan.x).multiplyScalar(p.off);
    p.g.position.copy(tmp).add(side); p.g.position.y = Math.abs(Math.sin(now * .008 + p.t * 50)) * .04;

  for (const p of parents) { p.t = (p.t + p.sp * .02 * dt) % 1; parentLoop.getPointAt(p.t, tmp); parentLoop.getTangentAt(p.t, tan); p.g.position.copy(tmp); p.g.rotation.y = Math.atan2(tan.x, tan.z); }

    else {

      flow.getPointAt(Math.min(tour.t + .03, 1), tan); controls.target.set(tan.x, 1.45, tan.z);
      const st = stageAt(tour.t); if (st !== curStage) { curStage = st; show(st); }
    }

});
